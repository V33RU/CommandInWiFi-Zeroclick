[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; WiFi + BLE together exceed the default 1.31 MB app partition, so use the
; huge_app scheme (~3 MB app, no OTA). We do not use OTA or a filesystem.
board_build.partitions = huge_app.csv
